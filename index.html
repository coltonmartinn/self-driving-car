<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Self-Driving City</title>
   <link rel="stylesheet" href="styles.css">
</head>
<body class="app">
   <header id="topbar">
      <div class="brand"><span class="icon">🚗</span> Self-Driving City</div>
      <form id="searchForm" class="search-form">
         <input id="searchInput" type="search" placeholder="Search a city, address or zip code…" autocomplete="off">
         <select id="sizeSelect" title="How much of the map to load">
            <option value="small">Small area</option>
            <option value="medium" selected>Medium area</option>
            <option value="large">Large area</option>
         </select>
         <button class="primary" type="submit"><span class="icon">🔍</span>Go</button>
         <div id="searchResults" class="search-results"></div>
      </form>
      <a class="side-link" href="editor.html" title="Design your own city from scratch">🏗️ Build your own city</a>
   </header>

   <main id="main">
      <div id="stage">
         <canvas id="carCanvas"></canvas>
         <div id="placeLabel"></div>

         <div id="welcome" class="overlay" style="display: none">
            <div class="card">
               <h2>Where do you want to drive?</h2>
               <p>
                  Search any real place above. Your cars learn to drive there by trial and
                  error, among traffic that already knows the rules of the road.
               </p>
               <div class="chips">
                  <button class="chip" data-q="Times Square, New York">🗽 Times Square</button>
                  <button class="chip" data-q="Paris, France">🥐 Paris</button>
                  <button class="chip" data-q="90210">🌴 90210</button>
                  <button class="chip" data-q="Shibuya, Tokyo">🗼 Shibuya</button>
                  <button class="chip" data-q="Austin, Texas">🎸 Austin</button>
                  <button class="chip" data-q="Amsterdam">🚲 Amsterdam</button>
               </div>
               <p class="muted">or <a href="editor.html">build your own city</a></p>
            </div>
         </div>

         <div id="loading" class="overlay" style="display: none">
            <div class="card">
               <div class="spinner"></div>
               <p id="loadingText">Loading…</p>
               <button id="loadingClose" style="display: none" onclick="hideLoading()">OK</button>
            </div>
         </div>
      </div>

      <aside id="sidebar">
         <div id="simControls">
            <button class="primary" onclick="nextGeneration()" title="Keep the best brain and start the next generation now"><span class="icon">🧬</span>Evolve now</button>
            <button onclick="restart()" title="Restart this generation"><span class="icon">🔁</span>Try again</button>
            <button id="autoBtn" onclick="toggleAuto()" title="Automatically evolve when every car has crashed or got stuck"><span class="icon">♾️</span>Auto-evolve</button>
            <button id="trafficBtn" onclick="toggleTraffic()" title="Turn traffic on or off"><span class="icon">🚙</span>Traffic</button>
            <button id="manualBtn" onclick="toggleManual()" title="Drive yourself with arrow keys / WASD"><span class="icon">🕹️</span>Drive myself</button>
            <button onclick="discardBrain()" title="Forget everything learned and start from scratch"><span class="icon">🧹</span>Forget brain</button>
         </div>
         <div id="stats"></div>
         <canvas id="networkCanvas"></canvas>
         <canvas id="miniMapCanvas"></canvas>
      </aside>
   </main>

   <script src="js/math/utils.js"></script>
   <script src="js/math/spatialGrid.js"></script>
   <script src="js/math/graph.js"></script>
   <script src="js/math/osm.js"></script>
   <script src="js/math/worldGenerator.js"></script>
   <script src="js/primitives/point.js"></script>
   <script src="js/primitives/segment.js"></script>
   <script src="js/primitives/polygon.js"></script>
   <script src="js/primitives/envelope.js"></script>
   <script src="js/items/building.js"></script>
   <script src="js/items/tree.js"></script>
   <script src="js/markings/marking.js"></script>
   <script src="js/markings/stop.js"></script>
   <script src="js/markings/yield.js"></script>
   <script src="js/markings/crossing.js"></script>
   <script src="js/markings/parking.js"></script>
   <script src="js/markings/light.js"></script>
   <script src="js/markings/start.js"></script>
   <script src="js/markings/target.js"></script>
   <script src="js/viewport.js"></script>
   <script src="js/world.js"></script>
   <script src="js/places.js"></script>
   <script src="js/placeSearch.js"></script>
   <script src="js/miniMap.js"></script>
   <script src="js/car/controls.js"></script>
   <script src="js/car/sensor.js"></script>
   <script src="js/car/network.js"></script>
   <script src="js/car/car.js"></script>
   <script src="js/car/trafficCar.js"></script>
   <script src="js/car/visualizer.js"></script>
   <script>
      const N = 100; // learning cars per generation
      const MUTATION = 0.1; // how much each copy of the best brain is changed
      const TRAFFIC_COUNT = 30;
      const STUCK_FRAMES = 300; // no progress for 5 s = out of this generation
      const GENERATION_FRAMES = 60 * 90; // a generation lasts at most 90 s

      const carCtx = carCanvas.getContext("2d");
      const networkCtx = networkCanvas.getContext("2d");

      const viewport = new Viewport(carCanvas, 2);
      const miniMap = new MiniMap(miniMapCanvas, new Graph(), 300);

      let world = null;
      let borderGrid = null;
      let network = null;
      let start = null;

      let cars = [];
      let traffic = [];
      let bestCar = null;
      let frame = 0;
      let evolveCountdown = -1;

      let manual = false;
      let autoEvolve = getSaved("autoEvolve") != "off";
      let trafficOn = getSaved("trafficOn") != "off";
      autoBtn.classList.toggle("active", autoEvolve);
      trafficBtn.classList.toggle("active", trafficOn);

      resize();
      window.addEventListener("resize", resize);

      new PlaceSearch({
         form: searchForm,
         input: searchInput,
         sizeSelect,
         results: searchResults,
         onPick: loadPlace,
      });
      for (const chip of document.querySelectorAll(".chip")) {
         chip.addEventListener("click", () => {
            searchInput.value = chip.dataset.q;
            searchForm.requestSubmit();
         });
      }

      let info = null;
      try {
         info = JSON.parse(localStorage.getItem("world"));
      } catch (e) {}
      if (info && info.graph && info.graph.segments.length > 0) {
         const saved = World.load(info);
         setWorld(saved);
         if (saved.roadWidthChanged && saved.source == "osm" && saved.place) {
            // saved by an older version with narrower roads: rebuild it
            loadPlace(saved.place);
         }
      } else {
         setWorld(new World(new Graph()));
         welcome.style.display = "flex";
      }
      animate();

      // ---------- loading real places ----------

      async function loadPlace(place) {
         welcome.style.display = "none";
         showLoading("Finding " + Places.shortName(place.name) + "…");
         try {
            const newWorld = await Places.loadPlace(place, showLoading);
            try {
               localStorage.setItem("world", JSON.stringify(newWorld));
            } catch (e) {
               // too big for browser storage; it still works until the page is closed
            }
            setWorld(newWorld);
            hideLoading();
         } catch (e) {
            showLoading("😕 " + e.message, true);
         }
      }

      function showLoading(text, isError = false) {
         loading.style.display = "flex";
         loadingText.textContent = text;
         loading.classList.toggle("error", isError);
         loadingClose.style.display = isError ? "inline-flex" : "none";
      }

      function hideLoading() {
         loading.style.display = "none";
         if (world.graph.segments.length == 0) {
            welcome.style.display = "flex";
         }
      }

      // ---------- world & generations ----------

      function setWorld(newWorld) {
         world = newWorld;
         miniMap.graph = world.graph;
         network = new TrafficNetwork(world);

         // index the road edges so each car only checks the ones near it
         borderGrid = new SpatialGrid(250);
         for (const seg of world.roadBorders) {
            borderGrid.insert([seg.p1, seg.p2], SpatialGrid.boundsOfSegment(seg.p1, seg.p2));
         }

         start = findStart(world);
         placeLabel.textContent = world.place
            ? "📍 " + Places.shortName(world.place.name)
            : world.graph.segments.length > 0 ? "🏗️ Your city" : "";
         restart();
      }

      // The 📍 start marking if there is one, otherwise a decent road near the middle
      function findStart(w) {
         const marking = w.markings.find((m) => m instanceof Start);
         if (marking) {
            const dir = marking.directionVector;
            return { point: marking.center, angle: -angle(dir) - Math.PI / 2 };
         }
         if (w.graph.segments.length == 0) {
            return { point: new Point(0, 0), angle: 0 };
         }
         const center = w.source == "osm"
            ? new Point(0, 0)
            : scale(w.graph.points.reduce((c, p) => add(c, p), new Point(0, 0)), 1 / w.graph.points.length);
         const roads = w.graph.segments.filter((s) => s.length() > w.roadWidth * 2.5);
         const pool = roads.length > 0 ? roads : w.graph.segments;
         let best = pool[0];
         for (const s of pool) {
            if (distance(average(s.p1, s.p2), center) < distance(average(best.p1, best.p2), center)) {
               best = s;
            }
         }
         const dir = best.directionVector();
         let point = average(best.p1, best.p2);
         if (!best.oneWay) {
            point = add(point, scale(perpendicular(dir), w.roadWidth / 4)); // right lane
         }
         return { point, angle: -angle(dir) - Math.PI / 2 };
      }

      function restart() {
         const type = manual ? "KEYS" : "AI";
         cars = [];
         for (let i = 0; i < (manual ? 1 : N); i++) {
            const car = new Car(start.point.x, start.point.y, 30, 50, type, start.angle, 4, "#2266dd");
            car.lastImprovement = 0;
            cars.push(car);
         }

         const saved = loadBrain();
         if (!manual && saved) {
            for (let i = 0; i < cars.length; i++) {
               cars[i].brain = JSON.parse(saved);
               if (i != 0) {
                  NeuralNetwork.mutate(cars[i].brain, MUTATION);
               }
            }
         }

         traffic = trafficOn && !isEmpty() ? spawnTraffic() : [];
         bestCar = cars[0];
         world.cars = cars;
         world.traffic = traffic;
         world.bestCar = bestCar;
         frame = 0;
         evolveCountdown = -1;
      }

      function isEmpty() {
         return world.graph.segments.length == 0;
      }

      function spawnTraffic() {
         const list = [];
         for (let i = 0; i < TRAFFIC_COUNT; i++) {
            const car = spawnTrafficCar(start.point, 350, 2500, list);
            if (car) {
               list.push(car);
            }
         }
         return list;
      }

      function spawnTrafficCar(around, minDist, maxDist, others) {
         for (let tries = 0; tries < 10; tries++) {
            const edge = network.randomEdgeNear(around, minDist, maxDist);
            if (!edge) {
               return null;
            }
            const car = new TrafficCar(network, edge);
            if (others.every((o) => distance(o, car) > 90)) {
               return car;
            }
         }
         return null;
      }

      // Brains from older versions may have a different shape; ignore those
      function loadBrain() {
         const saved = getSaved("bestBrain");
         if (!saved) {
            return null;
         }
         try {
            const brain = JSON.parse(saved);
            const probe = new Car(0, 0, 30, 50, "AI");
            const ok =
               brain.levels.length == probe.brain.levels.length &&
               brain.levels.every((l, i) => l.inputs.length == probe.brain.levels[i].inputs.length);
            return ok ? saved : null;
         } catch (e) {
            return null;
         }
      }

      function nextGeneration() {
         if (manual || isEmpty()) {
            return;
         }
         setSaved("bestBrain", JSON.stringify(bestCar.brain));
         setSaved("generation", String(getGeneration() + 1));
         if (bestCar.fitness > getRecord()) {
            setSaved("record", String(Math.round(bestCar.fitness)));
         }
         restart();
      }

      function discardBrain() {
         if (!confirm("Forget everything the cars have learned?")) {
            return;
         }
         setSaved("bestBrain", null);
         setSaved("generation", null);
         setSaved("record", null);
         restart();
      }

      function toggleManual() {
         manual = !manual;
         manualBtn.classList.toggle("active", manual);
         restart();
      }

      function toggleAuto() {
         autoEvolve = !autoEvolve;
         autoBtn.classList.toggle("active", autoEvolve);
         setSaved("autoEvolve", autoEvolve ? "on" : "off");
      }

      function toggleTraffic() {
         trafficOn = !trafficOn;
         trafficBtn.classList.toggle("active", trafficOn);
         setSaved("trafficOn", trafficOn ? "on" : "off");
         traffic = trafficOn && !isEmpty() ? spawnTraffic() : [];
         world.traffic = traffic;
      }

      // ---------- main loop ----------

      function animate() {
         world.update();
         frame++;

         for (const car of traffic) {
            car.update(traffic);
         }
         // keep traffic around the action: recycle cars that got lost or far away
         if (frame % 30 == 0 && traffic.length > 0) {
            for (let i = 0; i < traffic.length; i++) {
               const t = traffic[i];
               if (t.lost || distance(t, bestCar) > 3000) {
                  const replacement = spawnTrafficCar(bestCar, 1000, 2500, traffic);
                  if (replacement) {
                     traffic[i] = replacement;
                  }
               }
            }
         }

         for (const car of cars) {
            if (car.damaged || isEmpty()) {
               continue;
            }
            const near = SpatialGrid.boundsAround(car, 250);
            const borders = [...borderGrid.query(near)];
            const nearbyTraffic = traffic.filter(
               (t) => Math.abs(t.x - car.x) < 250 && Math.abs(t.y - car.y) < 250
            );
            car.update(borders, nearbyTraffic);

            // fitness = how far from the start the car has managed to get
            const d = distance(car, start.point);
            if (d > car.fitness + 1) {
               car.fitness = d;
               car.lastImprovement = frame;
            } else if (!manual && frame - car.lastImprovement > STUCK_FRAMES) {
               car.damaged = true; // stuck or going in circles
            }
         }

         bestCar = cars.reduce((best, car) => (car.fitness > best.fitness ? car : best));
         world.bestCar = bestCar;

         const alive = cars.filter((c) => !c.damaged).length;
         if (!manual && autoEvolve && !isEmpty() && evolveCountdown < 0 &&
            (alive == 0 || frame > GENERATION_FRAMES)) {
            evolveCountdown = 45; // short pause so you can see what happened
         }
         if (evolveCountdown > 0) {
            evolveCountdown--;
            if (evolveCountdown == 0) {
               nextGeneration();
            }
         }

         // camera follows the best car
         viewport.offset.x = -bestCar.x;
         viewport.offset.y = -bestCar.y;
         viewport.reset();
         const viewPoint = scale(viewport.getOffset(), -1);
         world.draw(carCtx, viewPoint, false, viewport.getRenderRadius());
         miniMap.update(viewPoint, cars);

         networkCtx.clearRect(0, 0, networkCanvas.width, networkCanvas.height);
         Visualizer.drawNetwork(networkCtx, bestCar.brain);

         updateStats(alive);
         requestAnimationFrame(animate);
      }

      function updateStats(alive) {
         if (isEmpty()) {
            stats.innerHTML = "Search for a place to start.";
            return;
         }
         if (manual) {
            stats.innerHTML = "🕹️ You're driving: arrow keys / WASD<br>Distance: " + meters(bestCar.fitness);
            return;
         }
         const record = Math.max(getRecord(), bestCar.fitness);
         let html =
            "<b>Generation " + getGeneration() + "</b> · " + alive + "/" + cars.length + " driving" +
            "<br>Best this round: " + meters(bestCar.fitness) + " · record " + meters(record);
         if (evolveCountdown > 0) {
            html += "<br>🧬 Evolving…";
         } else if (alive == 0) {
            html += "<br>Everyone crashed. Press 🧬 Evolve now.";
         }
         stats.innerHTML = html;
      }

      function meters(units) {
         return Math.round(units / Osm.UNITS_PER_METER) + " m";
      }

      function resize() {
         const sidebarWidth = 300;
         carCanvas.width = stage.clientWidth;
         carCanvas.height = stage.clientHeight;
         viewport.center = new Point(carCanvas.width / 2, carCanvas.height / 2);
         networkCanvas.width = sidebarWidth;
         networkCanvas.height = Math.max(
            180,
            sidebar.clientHeight - 300 - simControls.offsetHeight - stats.offsetHeight
         );
      }

      // ---------- storage helpers ----------

      function getSaved(key) {
         try {
            return localStorage.getItem(key);
         } catch (e) {
            return null;
         }
      }

      function setSaved(key, value) {
         try {
            if (value == null) {
               localStorage.removeItem(key);
            } else {
               localStorage.setItem(key, value);
            }
         } catch (e) {}
      }

      function getGeneration() {
         return Number(getSaved("generation")) || 1;
      }

      function getRecord() {
         return Number(getSaved("record")) || 0;
      }
   </script>
</body>
</html>
